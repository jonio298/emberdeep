# One-click host for Emberdeep + co-op on Render (free plan works; no Redis needed).
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: emberdeep
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STATS_KEY   # the secret for /stats?key=... (the traffic monitor). Set it in the Render dashboard; never commit it.
        sync: false
